<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090d">
  <title>JARVIS · Druckelite24</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="eyebrow">DRUCKELITE24 · VOICE SYSTEM</div>
      <h1>JARVIS</h1>
      <p id="status" class="status">Offline</p>

      <button id="toggle" class="orb" aria-label="JARVIS starten">
        <span class="core"></span>
      </button>

      <p class="hint">Tippen, Mikrofon freigeben und ganz normal sprechen.</p>
      <div id="log" class="log">Bereit.</div>
    </section>
  </main>

  <audio id="remoteAudio" autoplay playsinline></audio>
  <script type="module" src="/app.js"></script>
</body>
</html>
